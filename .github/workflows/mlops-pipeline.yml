name: MLOps CI/CD Pipeline & Continuous Training

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run automated real-time pipeline every 6 hours (Cron)
    - cron: '0 */6 * * *'

jobs:
  backend-ci-cd:
    name: Backend Lint, Test & Model Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Backend Unit & Integration Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ --ignore=venv

      - name: Validate ML Ingestion & Auto-Training Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from backend.ml.ingestion.live_fetcher import fetch_live_internet_data; df = fetch_live_internet_data(); print('Live Internet Data Fetched:', len(df), 'rows')"

  frontend-ci-cd:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Containerization Readiness
    runs-on: ubuntu-latest
    needs: [backend-ci-cd, frontend-ci-cd]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t creatoriq-backend:latest -f Dockerfile.backend .

      - name: Build Frontend Docker Image
        run: |
          docker build -t creatoriq-frontend:latest -f frontend/Dockerfile.frontend ./frontend
