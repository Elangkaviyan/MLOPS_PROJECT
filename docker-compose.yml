version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./mlruns:/app/mlruns
      - ./datasets:/app/datasets
      - ./models:/app/models
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
      - DATABASE_URL=sqlite:///./creator_iq.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
